    @media(max-width:1050px){.app{grid-template-columns:82px 1fr}.brand-text,.nav .label,.privacy{display:none}.sidebar{padding:20px 10px}.brand{justify-content:center;padding-inline:0}.nav button{justify-content:center;padding:13px 8px}.grid{grid-template-columns:1fr}.summary{position:relative;top:auto}.two-col{grid-template-columns:1fr}}
    @media(max-width:720px){.app{display:block}.sidebar{height:auto;position:fixed;z-index:40;bottom:0;top:auto;left:0;right:0;padding:7px 8px;display:block}.brand,.privacy{display:none}.nav{margin:0;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.nav button{font-size:.72rem;padding:9px 3px;display:block;text-align:center}.nav .label{display:block}.content{padding-bottom:70px}.topbar{height:auto;min-height:70px;padding:12px 14px;align-items:stretch;gap:10px;flex-direction:column}.topbar p{display:none}.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));width:100%}.actions .btn{display:block}.actions [data-action="export"]{display:none}.actions .btn:only-child{grid-column:1/-1}main{padding:14px}.card-body{padding:15px}.card-head{padding:15px}.form-grid{grid-template-columns:1fr}.field,.field.w6,.field.w8{grid-column:1}.line-wrap{overflow:visible}.line-table{min-width:0;display:block}.line-table thead{display:none}.line-table tbody{display:grid;gap:12px}.line-table tr{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;border:1px solid var(--line);border-radius:11px;padding:12px}.line-table td{display:block;border:0;padding:0}.line-table td:first-child,.line-table td:last-child{grid-column:1/-1}.line-table td:before{content:attr(data-label);display:block;font-size:.7rem;font-weight:800;text-transform:uppercase;color:#6d7b89;margin-bottom:4px}.record{grid-template-columns:1fr 1fr}.record-actions{grid-column:1/-1;justify-content:start}.two-col{display:block}.two-col>.card{margin-bottom:16px}.print-meta,.print-notes{grid-template-columns:1fr}.mobile-head{display:block}}
    @media print{body{background:#fff}.app,.toast,.modal-backdrop{display:none!important}.print-sheet{display:block!important;padding:0}.print-sheet.a4{width:210mm;min-height:297mm;padding:14mm}.print-sheet.letter{width:8.5in;min-height:11in;padding:.55in}@page{margin:0}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
  </style>

<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">TQ</div><div class="brand-text"><strong>TejQuote Pro</strong><small>TejMade Digital</small></div></div>
    <nav class="nav" aria-label="Main navigation">
      <button data-view="quotes" class="active"><span class="label">Quotes & Invoices</span><span>01</span></button>
      <button data-view="clients"><span class="label">Clients</span><span>02</span></button>
      <button data-view="services"><span class="label">Services</span><span>03</span></button>
      <button data-view="settings"><span class="label">Business Settings</span><span>04</span></button>
    </nav>
    <div class="privacy"><b>Private by design</b>All information stays in this browser. No account, tracking, or cloud connection.</div>
  </aside>
  <section class="content">
    <header class="topbar">
      <div><h1 id="pageTitle">Quotes & Invoices</h1><p id="pageSub">Price every job with profit before you send it.</p></div>
      <div class="actions" id="topActions"></div>
    </header>
    <main id="main"></main>
  </section>
</div>

<script>
(function(){
'use strict';
var KEY='tejquote_pro_v1';
var today=function(){return new Date().toISOString().slice(0,10)};
var addDays=function(n){var d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
var uid=function(p){return p+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7)};
var num=function(v){var n=Number(v);return Number.isFinite(n)?n:0};
var cents=function(v){return Math.round((num(v)+Number.EPSILON)*100)};
var dec=function(v){return Math.round(num(v)*100)/100};
var esc=function(v){return String(v==null?'':v).replace(/[&<>"']/g,function(s){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]})};
var attrs=esc;
var symbols={USD:'$',EUR:'€',GBP:'£',AUD:'A$',CAD:'C$',INR:'₹'};
function defaults(){
 var clients=[{id:'c_demo',name:'Jordan Lee',company:'Northside Property Care',email:'jordan@example.com',phone:'(555) 014-0082',address:'1420 Market Street\nSpringfield',notes:'Prefers email'}];
 var services=[
  {id:'s1',name:'Deep cleaning — 3 bedroom home',category:'Cleaning',unit:'job',cost:165,markup:70,price:280.5},
  {id:'s2',name:'Exterior pressure washing',category:'Pressure Washing',unit:'sq ft',cost:.08,markup:150,price:.20},
  {id:'s3',name:'Full interior auto detail',category:'Auto Detailing',unit:'job',cost:72,markup:108.33,price:150},
  {id:'s4',name:'Lawn mowing and edging',category:'Lawn Care',unit:'job',cost:24,markup:87.5,price:45},
  {id:'s5',name:'Handyman labour',category:'Handyman',unit:'hour',cost:32,markup:87.5,price:60},
  {id:'s6',name:'Design / consulting',category:'Freelance',unit:'hour',cost:25,markup:140,price:60}
 ];
 var q={id:'q_demo',type:'QUOTE',number:'QT-1001',issueDate:today(),dueDate:addDays(14),status:'Draft',clientId:'c_demo',currency:'USD',taxLabel:'Sales Tax',taxRate:7.5,discountType:'percent',discountValue:5,deposit:100,notes:'Thank you for the opportunity to quote this work.',terms:'Quote valid for 14 days. A 30% deposit confirms scheduling.',items:[
  {id:'i1',description:'Deep cleaning — 3 bedroom home',qty:1,unit:'job',cost:165,markup:70,price:280.5},
  {id:'i2',description:'Interior window cleaning',qty:8,unit:'item',cost:7.5,markup:100,price:15}
 ],updatedAt:Date.now()};
 return {version:1,settings:{businessName:'ClearPath Home Services',contactName:'Alex Morgan',email:'hello@clearpath.example',phone:'(555) 014-2200',address:'85 River Road\nSpringfield',website:'clearpath.example',logo:'',currency:'USD',customCurrency:'',taxLabel:'Sales Tax',taxRate:7.5,quotePrefix:'QT-',invoicePrefix:'INV-',nextQuote:1002,nextInvoice:1001,targetMargin:35,paper:'a4',defaultTerms:'Quote valid for 14 days. A 30% deposit confirms scheduling.'},clients:clients,services:services,quotes:[q]};
}
function load(){
 try{var x=JSON.parse(localStorage.getItem(KEY));if(x&&x.version===1&&Array.isArray(x.quotes))return x}catch(e){}
 var d=defaults();localStorage.setItem(KEY,JSON.stringify(d));return d;
}
var db=load(),view='quotes',draft=clone(db.quotes[0]||newQuoteData());
function clone(x){return JSON.parse(JSON.stringify(x))}
function persist(){localStorage.setItem(KEY,JSON.stringify(db))}
function currencySymbol(code){return code==='CUSTOM'?(db.settings.customCurrency||'¤'):(symbols[code]||code+' ')}
function moneyFromCents(v,code){return currencySymbol(code||draft.currency)+(Math.max(0,num(v))/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function money(v,code){return moneyFromCents(cents(v),code)}
function calc(q){
 var sub=0,cost=0;
 (q.items||[]).forEach(function(i){sub+=Math.round(cents(i.price)*num(i.qty));cost+=Math.round(cents(i.cost)*num(i.qty))});
 var discount=q.discountType==='percent'?Math.round(sub*Math.max(0,num(q.discountValue))/100):Math.min(sub,cents(q.discountValue));
 discount=Math.max(0,discount);var taxable=Math.max(0,sub-discount);var tax=Math.round(taxable*Math.max(0,num(q.taxRate))/100);var total=taxable+tax;var deposit=Math.max(0,cents(q.deposit));var balance=Math.max(0,total-deposit);var profit=taxable-cost;var margin=taxable>0?(profit/taxable*100):0;
 return {sub:sub,cost:cost,discount:discount,taxable:taxable,tax:tax,total:total,deposit:deposit,balance:balance,profit:profit,margin:margin};
}
function newQuoteData(){
 return {id:uid('q'),type:'QUOTE',number:db.settings.quotePrefix+db.settings.nextQuote,issueDate:today(),dueDate:addDays(14),status:'Draft',clientId:'',currency:db.settings.currency,taxLabel:db.settings.taxLabel,taxRate:db.settings.taxRate,discountType:'percent',discountValue:0,deposit:0,notes:'',terms:db.settings.defaultTerms,items:[{id:uid('i'),description:'',qty:1,unit:'job',cost:0,markup:50,price:0}],updatedAt:Date.now()};
}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(function(){t.classList.remove('show')},2600)}
function pageMeta(){
 var map={quotes:['Quotes & Invoices','Price every job with profit before you send it.'],clients:['Clients','Keep customer details ready for the next quote.'],services:['Service Catalog','Reuse profitable pricing instead of guessing each job.'],settings:['Business Settings','Set your brand, defaults, data and print preferences.']};
 document.getElementById('pageTitle').textContent=map[view][0];document.getElementById('pageSub').textContent=map[view][1];
 document.querySelectorAll('[data-view]').forEach(function(b){b.classList.toggle('active',b.dataset.view===view)});
}
function render(){pageMeta();var main=document.getElementById('main'),actions=document.getElementById('topActions');if(view==='quotes'){main.innerHTML=quotePage();actions.innerHTML='<button class="btn" data-action="export">Backup</button><button class="btn" data-action="print">Print / PDF</button><button class="btn primary" data-action="saveQuote">Save document</button>'}else if(view==='clients'){main.innerHTML=clientPage();actions.innerHTML='<button class="btn primary" data-action="newClient">Add client</button>'}else if(view==='services'){main.innerHTML=servicePage();actions.innerHTML='<button class="btn primary" data-action="newService">Add service</button>'}else{main.innerHTML=settingsPage();actions.innerHTML='<button class="btn primary" data-action="saveSettings">Save settings</button>'}updateSummary()}
function option(value,label,current){return '<option value="'+attrs(value)+'" '+(value===current?'selected':'')+'>'+esc(label)+'</option>'}
function quotePage(){
 var clients=db.clients.map(function(c){return option(c.id,(c.company?c.company+' — ':'')+c.name,draft.clientId)}).join('');
 var cur=['USD','EUR','GBP','AUD','CAD','INR','CUSTOM'].map(function(c){return option(c,c==='CUSTOM'?'Custom currency':c,draft.currency)}).join('');
 var rows=(draft.items||[]).map(lineRow).join('');
 var records=db.quotes.slice().sort(function(a,b){return b.updatedAt-a.updatedAt}).map(quoteRecord).join('');
 return '<div class="grid"><div class="stack"><section class="card"><div class="card-head"><h2>Document details</h2><button class="btn small" data-action="newQuote">New quote</button></div><div class="card-body"><div class="form-grid">'+
 '<div class="field"><label>Document type</label><select data-draft="type">'+option('QUOTE','Quote',draft.type)+option('INVOICE','Invoice',draft.type)+'</select></div>'+
 '<div class="field"><label>Document number</label><input data-draft="number" value="'+attrs(draft.number)+'"></div>'+
 '<div class="field"><label>Status</label><select data-draft="status">'+['Draft','Sent','Accepted','Invoiced','Paid'].map(function(x){return option(x,x,draft.status)}).join('')+'</select></div>'+
 '<div class="field"><label>Issue date</label><input type="date" data-draft="issueDate" value="'+attrs(draft.issueDate)+'"></div>'+
 '<div class="field"><label>'+(draft.type==='INVOICE'?'Due date':'Valid until')+'</label><input type="date" data-draft="dueDate" value="'+attrs(draft.dueDate)+'"></div>'+
 '<div class="field"><label>Currency</label><select data-draft="currency">'+cur+'</select></div>'+
 '<div class="field w8"><label>Client</label><select data-draft="clientId"><option value="">Select a client</option>'+clients+'</select></div>'+

});
document.addEventListener('input',function(e){
 var k=e.target.dataset.draft;if(k){draft[k]=['taxRate','discountValue','deposit'].indexOf(k)>=0?num(e.target.value):e.target.value;if(k==='discountType'||k==='currency'||k==='type')render();else updateSummary();return}
 var sk=e.target.dataset.setting;if(sk){db.settings[sk]=['taxRate','targetMargin'].indexOf(sk)>=0?num(e.target.value):e.target.value;return}
 var ik=e.target.dataset.item;if(ik){var tr=e.target.closest('[data-line]'),it=draft.items.find(function(x){return x.id===tr.dataset.line});if(!it)return;if(['qty','cost','markup','price'].indexOf(ik)>=0)it[ik]=num(e.target.value);else it[ik]=e.target.value;if(ik==='cost'||ik==='markup')it.price=dec(num(it.cost)*(1+num(it.markup)/100));if(ik==='price')it.markup=num(it.cost)>0?dec((num(it.price)/num(it.cost)-1)*100):0;var focus=ik,pos=draft.items.indexOf(it);render();var row=document.querySelectorAll('[data-line]')[pos];if(row){var input=row.querySelector('[data-item="'+focus+'"]');if(input){input.focus();try{input.setSelectionRange(input.value.length,input.value.length)}catch(x){}}}}
});
document.addEventListener('change',function(e){
 if(e.target.id==='importInput'&&e.target.files[0])importData(e.target.files[0]);
 if(e.target.id==='logoInput'&&e.target.files[0]){var f=e.target.files[0];if(f.size>1500000){toast('Use a logo smaller than 1.5 MB');return}var r=new FileReader();r.onload=function(){db.settings.logo=r.result;persist();render();toast('Logo saved locally')};r.readAsDataURL(f)}
 if(e.target.dataset.draft){draft[e.target.dataset.draft]=e.target.value;render()}
});
function filterQuoteRecords(){
 var searchEl=document.getElementById('quoteSearch'),filterEl=document.getElementById('quoteFilter');
 if(!searchEl||!filterEl)return;
 var search=(searchEl.value||'').toLowerCase(),filter=filterEl.value;
 document.querySelectorAll('[data-record]').forEach(function(el){
  var q=db.quotes.find(function(x){return x.id===el.dataset.record});
  if(!q){el.style.display='none';return}
  var client=db.clients.find(function(x){return x.id===q.clientId}),hay=(q.number+' '+(client?client.name+' '+client.company:'')).toLowerCase();
  el.style.display=hay.indexOf(search)>=0&&(!filter||q.status===filter)?'grid':'none';
 });
}
document.addEventListener('input',function(e){if(e.target.id==='quoteSearch')filterQuoteRecords()});
document.addEventListener('change',function(e){if(e.target.id==='quoteFilter')filterQuoteRecords()});
render();
if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js?v=1.0.3',{updateViaCache:'none'}).then(function(r){return r.update()}).catch(function(){})});
})();
</script>
